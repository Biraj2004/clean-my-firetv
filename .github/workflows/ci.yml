name: CI & Code Integrity

on:
  push:
    branches: [ master, main, clean-my-firetv ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master, main, clean-my-firetv ]
  workflow_dispatch:

jobs:
  validate:
    name: Validate Python Scripts & Structure
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Check Python Syntax & Compilation
        run: |
          python -c "import py_compile, glob; [py_compile.compile(f, doraise=True) for f in glob.glob('*.py') + glob.glob('core/*.py') + glob.glob('scripts/*.py')]"

      - name: Verify Core Modules Import
        run: |
          python -c "import core.adb, core.journal, core.lists; print('Core modules validated successfully.')"

      - name: Verify Config & Asset Integrity
        shell: bash
        run: |
          python -c "
          import zipfile, os

          # Verify configuration file
          assert os.path.exists('home.conf'), 'Missing home.conf'
          with open('home.conf', 'r', encoding='utf-8') as f:
              conf = f.read()
              assert 'apps.order=' in conf, 'home.conf missing apps.order'
              assert 'apps.hide=' in conf, 'home.conf missing apps.hide'
          print('Verified home.conf syntax and entries.')

          # Verify all 8 production assets
          required_assets = [
              'assets/screenshot-home-page1.png',
              'assets/screenshot-home-page2.png',
              'assets/screenshot-home-page3.png',
              'assets/screenshot-header-chips.png',
              'assets/screenshot-wifi-overlay.png',
              'assets/screenshot-bluetooth-overlay.png',
              'assets/screenshot-universal-verification.png',
              'assets/wallpaper-dark-ambient.jpg'
          ]
          for asset in required_assets:
              assert os.path.exists(asset), f'Missing production asset: {asset}'
              assert os.path.getsize(asset) > 1000, f'Asset file empty or corrupted: {asset}'
          print(f'Verified all {len(required_assets)} production showcase assets.')

          # Verify APK structure if present in workspace (distributed via GitHub Releases)
          for cand in ['dumbtv-enhanced-home-v1.0.1.apk', 'dumbtv-enhanced-home.apk']:
              if os.path.exists(cand):
                  with zipfile.ZipFile(cand, 'r') as z:
                      files = z.namelist()
                      assert 'AndroidManifest.xml' in files, 'Corrupted APK: missing AndroidManifest.xml'
                      assert 'classes.dex' in files, 'Corrupted APK: missing classes.dex'
                  print(f'Verified APK structure and integrity: {cand}')
          "

  release:
    name: Publish Release Assets
    needs: validate
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate Checksums
        run: |
          sha256sum home.conf > checksums.sha256
          if [ -f "dumbtv-enhanced-home-v1.0.1.apk" ]; then
            sha256sum dumbtv-enhanced-home-v1.0.1.apk >> checksums.sha256
          fi
          cat checksums.sha256

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            checksums.sha256
            home.conf
            assets/wallpaper-dark-ambient.jpg
          generate_release_notes: true
